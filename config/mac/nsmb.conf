# OPTIONAL, and only for a Mac that fails with "backup disk image disconnected" while the Pi
# runs an affected Samba (4.21.x or 4.22.0 to 4.22.5). The better fix is updating Samba on the Pi.
# Copy to /etc/nsmb.conf on the Mac (needs sudo), and delete the file once Samba is updated.
#   sudo cp nsmb.conf /etc/nsmb.conf
[default]
signing_required=yes
protocol_vers_map=6
