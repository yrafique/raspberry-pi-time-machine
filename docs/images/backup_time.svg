<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How long the first backup takes</title>
  <desc id="dsc">At 15 MB/s a first backup takes about 1.9 hours for 100 GB, 9.3 hours for 500 GB and 18.5 hours for 1 TB. At 40 MB/s it takes 0.7, 3.5 and 7 hours.</desc>
