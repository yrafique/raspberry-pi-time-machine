  <title id="ttl">What the share script builds</title>
  <desc id="dsc">config.env feeds 03-configure-shares.sh, which creates Linux users, folders, the Samba share configuration and the Bonjour service file, then restarts the services and sets passwords, leaving shares the Macs can find and use.</desc>
