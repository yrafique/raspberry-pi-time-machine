<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How to get things back</title>
  <desc id="dsc">For one file, browse Time Machine from the menu bar. For a new Mac, use Setup Assistant. For a wiped Mac, boot into macOS Recovery.</desc>
