<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Replacing the disk</title>
  <desc id="dsc">Connect the new disk, set DISK in config.env, run the prepare, shares and harden scripts, then re-add the backup disk on each Mac. Keep the old disk for a while.</desc>
