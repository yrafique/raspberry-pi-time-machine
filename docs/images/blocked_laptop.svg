<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">A Mac that can't reach the Pi</title>
  <desc id="dsc">A normal Mac sends SMB on port 445 straight to the Pi. A Mac with a security client has its SMB traffic intercepted before it leaves, so the Pi sees no packets at all.</desc>
