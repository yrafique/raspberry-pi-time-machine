<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Which port to use on a Raspberry Pi 4</title>
  <desc id="dsc">Plug the USB drive into a blue USB 3.0 port. A black USB 2.0 port is about ten times slower. Ethernet goes to the router and USB-C to the power supply.</desc>
