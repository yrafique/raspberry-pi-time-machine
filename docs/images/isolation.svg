<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">One login per share</title>
  <desc id="dsc">Mac A's login opens only the TimeMachine-Personal share and its folder. Mac B's login opens only TimeMachine-Work. Each is refused on the other's share.</desc>
