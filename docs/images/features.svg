<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 292" width="1200" height="292" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What you end up with</title>
  <desc id="dsc">Five benefits: automatic hourly backups, one share per Mac, the whole disk shared, it survives power cuts, and about an hour of work.</desc>
