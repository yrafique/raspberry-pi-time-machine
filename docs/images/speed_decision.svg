<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How to speed things up</title>
  <desc id="dsc">Check whether the Mac is on Wi-Fi, whether the disk is on a 5000M USB 3.0 port, and whether the Ethernet link says 1000. Each failed check has a fix; if all pass, you are at the hardware limit.</desc>
