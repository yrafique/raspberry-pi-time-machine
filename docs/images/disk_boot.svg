<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Disk and boot problems</title>
  <desc id="dsc">Four symptoms and their fixes: a disk missing from lsblk, a disk that shows 480M, an empty mount, and emergency mode on boot.</desc>
  <defs>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FB3FF"/><stop offset="1" stop-color="#0A6CFF"/></linearGradient>
    <radialGradient id="r-blue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0A6CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#0A6CFF" stop-opacity="0"/></radialGradient>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#4FB3FF" stroke="#4FB3FF" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CE0FF"/><stop offset="1" stop-color="#1FA6E0"/></linearGradient>
    <radialGradient id="r-teal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1FA6E0" stop-opacity="0.55"/><stop offset="1" stop-color="#1FA6E0" stop-opacity="0"/></radialGradient>
    <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#7CE0FF" stroke="#7CE0FF" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BE584"/><stop offset="1" stop-color="#1FA54A"/></linearGradient>
    <radialGradient id="r-green" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1FA54A" stop-opacity="0.55"/><stop offset="1" stop-color="#1FA54A" stop-opacity="0"/></radialGradient>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#5BE584" stroke="#5BE584" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24B"/><stop offset="1" stop-color="#FF8A00"/></linearGradient>
    <radialGradient id="r-orange" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF8A00" stop-opacity="0.55"/><stop offset="1" stop-color="#FF8A00" stop-opacity="0"/></radialGradient>
    <marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#FFC24B" stroke="#FFC24B" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A70"/><stop offset="1" stop-color="#E0281F"/></linearGradient>
    <radialGradient id="r-red" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E0281F" stop-opacity="0.55"/><stop offset="1" stop-color="#E0281F" stop-opacity="0"/></radialGradient>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#FF7A70" stroke="#FF7A70" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D58BFF"/><stop offset="1" stop-color="#8F3FD0"/></linearGradient>
    <radialGradient id="r-purple" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8F3FD0" stop-opacity="0.55"/><stop offset="1" stop-color="#8F3FD0" stop-opacity="0"/></radialGradient>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#D58BFF" stroke="#D58BFF" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8FB8"/><stop offset="1" stop-color="#E03A7C"/></linearGradient>
    <radialGradient id="r-pink" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E03A7C" stop-opacity="0.55"/><stop offset="1" stop-color="#E03A7C" stop-opacity="0"/></radialGradient>
    <marker id="a-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#FF8FB8" stroke="#FF8FB8" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-gray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9ADB8"/><stop offset="1" stop-color="#5F6572"/></linearGradient>
    <radialGradient id="r-gray" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5F6572" stop-opacity="0.55"/><stop offset="1" stop-color="#5F6572" stop-opacity="0"/></radialGradient>
    <marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#A9ADB8" stroke="#A9ADB8" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="g-indigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B8CFF"/><stop offset="1" stop-color="#4B4DE0"/></linearGradient>
    <radialGradient id="r-indigo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4B4DE0" stop-opacity="0.55"/><stop offset="1" stop-color="#4B4DE0" stop-opacity="0"/></radialGradient>
    <marker id="a-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5 1 8.8z" fill="#8B8CFF" stroke="#8B8CFF" stroke-width="1" stroke-linejoin="round"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1B"/><stop offset="1" stop-color="#131A30"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.11"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="tilehl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="tileshadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="panel"><rect width="1200" height="430" rx="34"/></clipPath>
    <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif; }
    .t  { font-size: 25px; font-weight: 650; fill: #F5F5F7; letter-spacing: -0.012em; }
    .tl { font-size: 21px; font-weight: 650; fill: #F5F5F7; letter-spacing: -0.008em; }
    .s  { font-size: 18px; font-weight: 450; fill: #A7ADBB; letter-spacing: 0.002em; }
    .eyebrow { font-size: 15px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; }
    .h1 { font-size: 40px; font-weight: 720; fill: #F5F5F7; letter-spacing: -0.028em; }
    .big { font-size: 46px; font-weight: 720; fill: #F5F5F7; letter-spacing: -0.03em; }
    .m  { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-size: 17px; font-weight: 500; fill: #A7ADBB; }
    .flow { stroke-dasharray: 2 13; stroke-linecap: round; animation: flow 1.3s linear infinite; }
    .flowr { stroke-dasharray: 2 13; stroke-linecap: round; animation: flowr 1.3s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -15; } }
    @keyframes flowr { to { stroke-dashoffset: 15; } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .flow,.flowr,.pulse,.float { animation: none; } }
</style>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <circle cx="144" cy="0" r="660" fill="url(#r-orange)" opacity="0.5"/><circle cx="1104" cy="430" r="660" fill="url(#r-green)" opacity="0.5"/>
    <g opacity="0.5"><rect width="1200" height="430" fill="none"/></g>
  </g>
  <text x="56" y="56" class="eyebrow" text-anchor="start" fill="#7CE0FF">Disk and boot problems</text>
<rect x="55.0" y="75.0" width="250.0" height="150.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="55.0" y="75.0" width="250.0" height="150.0" rx="22" fill="#FFC24B" opacity="0.10"/>
<rect x="55.5" y="75.5" width="249.0" height="149.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<g filter="url(#tileshadow)"><rect x="157.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#g-orange)"/></g>
<rect x="157.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#tilehl)"/>
<rect x="157.5" y="95.5" width="45" height="45" rx="12.4" fill="none" stroke="#fff" stroke-opacity="0.28"/>
<g transform="translate(168.5,106.5) scale(0.958)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18.5" r="2"/><path d="M12 16.5V4M12 4l-2.5 2.5M12 4l2.5 2.5M12 11l-4-2v-1.5M12 13l4-2.5"/></g>
<text x="180.0" y="173.0" class="tl" text-anchor="middle" >Disk missing</text>
<text x="180.0" y="201.0" class="s" text-anchor="middle" >not in lsblk</text>
<path d="M180,226 L180,274" fill="none" stroke="#5BE584" stroke-opacity="0.42" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a-green)"/>
<path d="M180,226 L180,274" fill="none" stroke="#5BE584" stroke-width="3.2" class="flow"/>
<rect x="55.0" y="280.0" width="250.0" height="118.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="55.0" y="280.0" width="250.0" height="118.0" rx="22" fill="#5BE584" opacity="0.10"/>
<rect x="55.5" y="280.5" width="249.0" height="117.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<text x="180" y="306" class="eyebrow" text-anchor="middle" fill="#5BE584">the fix</text>
<text x="180.0" y="334.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >Try another USB port</text>
<text x="180.0" y="356.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >and cable. A 3.5-inch</text>
<text x="180.0" y="378.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >disk needs its own power.</text>
<rect x="335.0" y="75.0" width="250.0" height="150.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="335.0" y="75.0" width="250.0" height="150.0" rx="22" fill="#FFC24B" opacity="0.10"/>
<rect x="335.5" y="75.5" width="249.0" height="149.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<g filter="url(#tileshadow)"><rect x="437.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#g-orange)"/></g>
<rect x="437.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#tilehl)"/>
<rect x="437.5" y="95.5" width="45" height="45" rx="12.4" fill="none" stroke="#fff" stroke-opacity="0.28"/>
<g transform="translate(448.5,106.5) scale(0.958)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13l4-4"/></g>
<text x="460.0" y="173.0" class="tl" text-anchor="middle" >Shows 480M</text>
<text x="460.0" y="201.0" class="s" text-anchor="middle" >in lsusb -t</text>
<path d="M460,226 L460,274" fill="none" stroke="#5BE584" stroke-opacity="0.42" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a-green)"/>
<path d="M460,226 L460,274" fill="none" stroke="#5BE584" stroke-width="3.2" class="flow"/>
<rect x="335.0" y="280.0" width="250.0" height="118.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="335.0" y="280.0" width="250.0" height="118.0" rx="22" fill="#5BE584" opacity="0.10"/>
<rect x="335.5" y="280.5" width="249.0" height="117.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<text x="460" y="306" class="eyebrow" text-anchor="middle" fill="#5BE584">the fix</text>
<text x="460.0" y="334.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >It's on USB 2.0.</text>
<text x="460.0" y="356.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >Use a blue port and a</text>
<text x="460.0" y="378.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >USB 3.0 cable.</text>
<rect x="615.0" y="75.0" width="250.0" height="150.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="615.0" y="75.0" width="250.0" height="150.0" rx="22" fill="#FFC24B" opacity="0.10"/>
<rect x="615.5" y="75.5" width="249.0" height="149.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<g filter="url(#tileshadow)"><rect x="717.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#g-orange)"/></g>
<rect x="717.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#tilehl)"/>
<rect x="717.5" y="95.5" width="45" height="45" rx="12.4" fill="none" stroke="#fff" stroke-opacity="0.28"/>
<g transform="translate(728.5,106.5) scale(0.958)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g>
<text x="740.0" y="173.0" class="tl" text-anchor="middle" >Mount is empty</text>
<text x="740.0" y="201.0" class="s" text-anchor="middle" >/srv/timemachine</text>
<path d="M740,226 L740,274" fill="none" stroke="#5BE584" stroke-opacity="0.42" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a-green)"/>
<path d="M740,226 L740,274" fill="none" stroke="#5BE584" stroke-width="3.2" class="flow"/>
<rect x="615.0" y="280.0" width="250.0" height="118.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="615.0" y="280.0" width="250.0" height="118.0" rx="22" fill="#5BE584" opacity="0.10"/>
<rect x="615.5" y="280.5" width="249.0" height="117.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<text x="740" y="306" class="eyebrow" text-anchor="middle" fill="#5BE584">the fix</text>
<text x="740.0" y="334.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >The disk didn't mount.</text>
<text x="740.0" y="356.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >Run: sudo mount ...</text>
<text x="740.0" y="378.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >Samba stays stopped.</text>
<rect x="895.0" y="75.0" width="250.0" height="150.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="895.0" y="75.0" width="250.0" height="150.0" rx="22" fill="#FFC24B" opacity="0.10"/>
<rect x="895.5" y="75.5" width="249.0" height="149.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<g filter="url(#tileshadow)"><rect x="997.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#g-orange)"/></g>
<rect x="997.0" y="95.0" width="46" height="46" rx="12.4" fill="url(#tilehl)"/>
<rect x="997.5" y="95.5" width="45" height="45" rx="12.4" fill="none" stroke="#fff" stroke-opacity="0.28"/>
<g transform="translate(1008.5,106.5) scale(0.958)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".8" fill="#fff"/></g>
<text x="1020.0" y="173.0" class="tl" text-anchor="middle" >Emergency mode</text>
<text x="1020.0" y="201.0" class="s" text-anchor="middle" >on boot</text>
<path d="M1020,226 L1020,274" fill="none" stroke="#5BE584" stroke-opacity="0.42" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a-green)"/>
<path d="M1020,226 L1020,274" fill="none" stroke="#5BE584" stroke-width="3.2" class="flow"/>
<rect x="895.0" y="280.0" width="250.0" height="118.0" rx="22" fill="url(#glass)" filter="url(#shadow)"/>
<rect x="895.0" y="280.0" width="250.0" height="118.0" rx="22" fill="#5BE584" opacity="0.10"/>
<rect x="895.5" y="280.5" width="249.0" height="117.0" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<text x="1020" y="306" class="eyebrow" text-anchor="middle" fill="#5BE584">the fix</text>
<text x="1020.0" y="334.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >A bad /etc/fstab line.</text>
<text x="1020.0" y="356.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >Make sure the disk</text>
<text x="1020.0" y="378.0" class="s" text-anchor="middle" style="fill:#F5F5F7" >line has nofail.</text>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="34" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
</svg>
