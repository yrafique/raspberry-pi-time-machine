<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What happens during a backup</title>
  <desc id="dsc">The Pi's Avahi announces the share, the Mac connects to Samba with its login, creates a backup file, and then sends only what changed every hour; Samba writes it to the disk.</desc>
