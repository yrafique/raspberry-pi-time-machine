<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 388" width="1200" height="388" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What Time Machine keeps</title>
  <desc id="dsc">The first backup copies everything. After that, it keeps hourly backups for 24 hours, daily backups for a month, and weekly backups until the disk is full.</desc>
