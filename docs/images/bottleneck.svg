<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Where the bottleneck is</title>
  <desc id="dsc">Data passes through Wi-Fi at about 15 to 60 MB/s, gigabit Ethernet at about 110 MB/s, and USB 3.0 at about 400 MB/s to a disk that does about 145 MB/s. The slowest link sets the speed.</desc>
